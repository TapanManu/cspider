<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cspider</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">cspider</div>
    <select id="prPicker" aria-label="pull request"></select>
    <div class="spacer"></div>
    <div id="counts" class="counts"></div>
    <div id="progress" class="progress"></div>
  </header>

  <!-- Disclosures sit above everything: a bounded or degraded analysis must never look complete. -->
  <div id="banners"></div>

  <main>
    <!-- 1. Files, because that is where a review starts -->
    <section id="filesPane">
      <div class="paneHead">
        <span id="filesTitle">Files</span>
        <div class="spacer"></div>
        <input id="filter" type="search" placeholder="filter…" aria-label="filter">
      </div>
      <div id="fileList"></div>
    </section>

    <!-- 2. Impact: an ego view of the selected symbol, not a whole-PR hairball -->
    <section id="impactPane">
      <div class="paneHead">
        <span id="impactTitle">Impact</span>
        <span id="impactSub" class="sub2"></span>
        <div class="spacer"></div>
        <label><input type="checkbox" id="showTests" checked> tests</label>
        <button id="overviewBtn" title="file-level overview">overview</button>
        <button id="fit">fit</button>
      </div>
      <div id="cy"></div>
      <div id="legend"></div>
    </section>

    <!-- 3. What actually changed, and who it breaks -->
    <aside id="detailPane">
      <div class="paneHead">
        <span>Change</span>
        <div class="spacer"></div>
        <button id="markBtn" hidden>mark reviewed</button>
      </div>
      <div id="detail" class="empty">
        <p>Pick a change on the left.</p>
        <p class="hint">Selecting one shows its callers and callees as lanes in the middle, and the
        before/after plus every call site here.</p>
      </div>
    </aside>
  </main>

  <script src="/vendor/cytoscape.min.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
