<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cspider</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">cspider</div>
    <select id="prPicker" aria-label="pull request"></select>
    <div class="spacer"></div>
    <div id="counts" class="counts"></div>
    <div id="progress" class="progress"></div>
  </header>

  <!-- Disclosures sit above everything: a bounded or degraded analysis must never look complete. -->
  <div id="banners"></div>

  <main>
    <!-- Left: modified files -->
    <nav id="filesPane">
      <div class="paneHead">
        <span id="filesTitle">Files</span>
        <div class="spacer"></div>
        <input id="filter" type="search" placeholder="filter…" aria-label="filter">
      </div>
      <div id="fileList"></div>
    </nav>

    <div id="rightCol">
      <!-- Top right: impact graph. SVG with a viewBox, so it always fits its pane exactly. -->
      <section id="graphPane">
        <div class="paneHead">
          <span id="impactTitle">Impact</span>
          <span id="impactSub" class="sub2"></span>
          <div class="spacer"></div>
          <label><input type="checkbox" id="showTests" checked> tests</label>
          <button id="overviewBtn">overview</button>
        </div>
        <div id="graph"></div>
      </section>

      <div id="splitter" title="drag to resize"></div>

      <!-- Bottom right: what actually changed, and who it breaks -->
      <section id="detailPane">
        <div class="paneHead">
          <span id="detailTitle">Change</span>
          <div class="spacer"></div>
          <button id="draftsBtn">drafts <span id="draftCount">0</span></button>
          <button id="markBtn" hidden>mark reviewed</button>
        </div>
        <div id="detail" class="empty">
          <p>Pick a file on the left, then a change inside it.</p>
          <p class="hint">The graph above shows what calls it and what it reaches. The diff and every
          call site appear here.</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Review drawer: drafts live here until an explicit, confirmed submit. -->
  <div id="drawer" hidden>
    <div class="drawerBox">
      <div class="drawerHead">
        <span>Review</span>
        <div class="spacer"></div>
        <button id="drawerClose">close</button>
      </div>
      <div id="drawerBody"></div>
      <div class="drawerFoot">
        <select id="reviewEvent">
          <option value="COMMENT">Comment</option>
          <option value="REQUEST_CHANGES">Request changes</option>
          <option value="APPROVE">Approve</option>
        </select>
        <input id="reviewBody" placeholder="overall review comment (optional)">
        <div class="spacer"></div>
        <button id="previewBtn">preview payload</button>
      </div>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
